<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tesla OAuth Callback</title>
</head>
<body style="font-family: sans-serif; max-width: 40em; margin: 3em auto; padding: 0 1em;">
  <h1>Tesla Login abgeschlossen</h1>
  <p>Kopiere den folgenden Code zurück ins Terminal:</p>
  <pre id="code" style="font-size: 1.3em; padding: 1em; background: #eee; white-space: pre-wrap; word-break: break-all;"></pre>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById("code").textContent = params.get("code") || "(kein Code in der URL gefunden)";
  </script>
</body>
</html>
